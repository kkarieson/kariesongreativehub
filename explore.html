    font-size:20px;
    font-weight:800;
    line-height:1.4;

  .programme-title:hover{
    color:var(--corporate-red);
  }

  color:var(--corporate-red);
  font-size:30px;
  font-weight:400;
  line-height:1;
  text-align:center;
}

    display:none;

  }

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    width:100%;
    color:var(--black);
    text-decoration:none;
    font-size:17px;
    font-weight:800;
    line-height:1.5;
    cursor:pointer;

    color:var(--corporate-red);
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
  }

  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
}

.topic-link:after{
  content:"+";
  margin-left:auto;
  color:var(--corporate-red);
  font-size:30px;
  font-weight:400;
  line-height:1;
}

.topic.expanded .topic-link:after{
  content:"−";
}

  .topic-details{
    display:none;
    margin-top:20px;
  }

  .topic.expanded .topic-details{
    display:grid;
    grid-template-columns:minmax(220px,320px) 1fr;
    gap:28px;
    align-items:start;

display: block;

height: auto;

const level = document.getElementById("level");
const programme = document.getElementById("programme");
const results = document.getElementById("results");


/* =========================================================
   LEVEL CHANGE
========================================================= */

level.addEventListener("change", () => {

  const programmes = Object.keys(data[level.value] || {});

  programme.innerHTML =
    '<option value="" selected disabled>Select programme</option>';

  programmes.forEach(p => {

    const o = document.createElement("option");

    o.value = p;
    o.textContent = p;

    programme.appendChild(o);

  });

  programme.disabled = programmes.length === 0;

  results.innerHTML =
    '<div class="empty">Select a programme to explore research topics.</div>';

});


programme.addEventListener("change", render);


/* =========================================================
   COMPLETE RESEARCH PREVIEW
   Opens directly from JavaScript
========================================================= */

function openResearchPreview(
  name,
  item,
  levelName,
  programmeName
) {

  const synopsis =
    typeof item === "string"
      ? `This research topic examines ${name.toLowerCase()}. The study can investigate the background of the problem, key variables, relevant stakeholders, existing evidence, methodological approaches, findings and practical recommendations.`
      : item.synopsis;

  const cover =
    typeof item === "string"
      ? IMG
      : item.cover;

  const buyLink =
    typeof item === "string"
      ? `buy.html?topic=${encodeURIComponent(name)}`
      : item.link;

  const previewWindow = window.open("", "_blank");

  if (!previewWindow) {

    alert(
      "Please allow pop-ups to open the research preview."
    );

    return;
  }


  previewWindow.document.write(`

  margin: 0;
  padding: 0;

  font-family: Arial, Helvetica, sans-serif;
  font-size: 16px;
  line-height: 1.7;

  background: #f3f3f3;
  color: #222;

  overflow-x: hidden;
}

header {
  width: 100%;
  margin: 0;
  padding: 22px 16px;
  background: #000;
  color: #fff;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: clamp(20px, 5vw, 28px);
  line-height: 1.4;
}

header p {
  margin: 5px 0 0;
  color: #ddd;
  font-size: 14px;
}

.container {
  width: 100%;
  max-width: 1200px;
  min-width: 0;
  margin: 0 auto;
  padding: 24px 16px;
}

.preview-card {
  display: block;
  width: 100%;
  max-width: 1000px;
  min-width: 0;
  margin: 0 auto;
  padding: clamp(16px, 4vw, 40px);

  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 8px;

  box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
}

.preview-card h2 {
  margin: 0 0 15px;
  color: #c00000;
  font-size: clamp(21px, 4vw, 28px);
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.meta {
  margin-bottom: 20px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.preview-card h3 {
  margin: 26px 0 10px;
  color: #c00000;
  font-size: clamp(17px, 3vw, 20px);
  line-height: 1.4;
}

.preview-card p {
  margin: 0 0 14px;
  font-size: 16px;
  line-height: 1.8;
  overflow-wrap: break-word;
}

.preview-card ol,
.preview-card ul {
  margin: 0 0 18px;
  padding-left: 25px;
}

.preview-card li {
  margin-bottom: 8px;
  font-size: 16px;
  line-height: 1.8;
  overflow-wrap: break-word;
}

.preview-card .cover {
  display: block;

  width: auto;
  max-width: 100%;
  height: auto;
  max-height: 650px;

  object-fit: contain;

  margin: 24px auto;
  border: 1px solid #ddd;
  background: #f5f5f5;
}

.actions {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  margin-top: 30px;
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-height: 46px;
  padding: 12px 22px;
  border: none;
  border-radius: 5px;
  text-decoration: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.back {
  background: #000;
  color: #fff;
}

.buy {
  background: #c00000;
  color: #fff;
}


footer {
  width: 100%;
  margin-top: 30px;
  padding: 20px 15px;
  background: #000;
  color: #fff;
  text-align: center;
  font-size: 13px;
}

/* TABLETS */
@media (min-width: 601px) and (max-width: 900px) {
  .container {
    padding: 24px;
  }

  .preview-card {
    max-width: 100%;
  }
}

/* MOBILE */
@media (max-width: 600px) {
  html,
  body {
    width: 100%;
    min-width: 0;
  }

  header {
    padding: 18px 14px;
  }

  .container {
    width: 100%;
    max-width: none;
    padding: 12px;
    margin: 0;
  }

  .preview-card {
    width: 100%;
    max-width: none;
    padding: 20px 16px;
    margin: 0;
    border-radius: 6px;
  }

  .preview-card h2 {
    font-size: 21px;
  }

  .preview-card h3 {
    font-size: 17px;
  }

  .preview-card p,
  .preview-card li {
    font-size: 15px;
    line-height: 1.75;
  }

    .preview-card .cover {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    max-height: none;
    object-fit: contain;
    margin: 20px auto;
    box-sizing: border-box;
  }


  .actions {
    flex-direction: column;
    align-items: stretch;
  }

  .btn {
    width: 100%;
    min-height: 46px;
  }
}

/* VERY SMALL PHONES */
@media (max-width: 380px) {
  .container {
    padding: 8px;
  }

  .preview-card {
    padding: 16px 12px;
  }

  .preview-card h2 {
    font-size: 19px;
  }

  .preview-card p,
  .preview-card li {
    font-size: 14px;
  }
}

/* DARK MODE */
@media (prefers-color-scheme: dark) {
  body {
    background: #000;
    color: #fff;
  }

  .preview-card {
    background: #0b0b0b;
    color: #fff;
    border-color: #383838;
  }

  .preview-card p,
  .preview-card li {
    color: #ddd;
  }

  .preview-card h2,
  .preview-card h3 {
    color: #e00000;
  }

  .preview-card .cover {
    background: #171717;
    border-color: #383838;
  }

  .back {
    background: #fff;
    color: #000;
  }

  .buy {
    background: #c00000;
    color: #fff;
  }

  footer {
    background: #080808;
    color: #aaa;
  }
}
</style>

</head>


<body>


<header>

  <h1>Karieson Creative Hub</h1>

  <p>Research Project Preview</p>

</header>


<main class="container">

  <div class="preview-card">

    <h2>${name}</h2>

    <div class="meta">

      <strong>Academic Level:</strong>
      ${levelName}

      <br>

      <strong>Programme:</strong>
      ${programmeName}

    </div>


  <!-- =====================================================
       COVER
  ====================================================== -->

    <img
      src="${cover}"
      class="cover"
      alt="Research cover for ${name}"
      onerror="this.style.display='none';"
    >

  </section>


  <!-- =====================================================
       1. INTRODUCTION
  ====================================================== -->

  <section class="section">

    <h3>1. Introduction</h3>

    <p>
      This research topic focuses on
      <strong>${name}</strong>.
      The study introduces the subject,
      provides its context and identifies
      the major issues requiring investigation.
    </p>

    <p>
      The research provides an academic
      framework for understanding the topic
      and examining relevant factors,
      challenges and possible solutions.
    </p>

  </section>


  <!-- =====================================================
       2. BACKGROUND
  ====================================================== -->

  <section class="section">

    <h3>2. Background of the Study</h3>

      The background section provides the
      context surrounding
      <strong>${name}</strong>.
      It examines the circumstances that
      have contributed to the development
      of the issue and explains why the
      topic requires academic investigation.
    </p>

  </section>


  <!-- =====================================================
       3. STATEMENT OF THE PROBLEM
  ====================================================== -->

  <section class="section">

    <h3>3. Statement of the Problem</h3>

    <p>
      Despite existing developments and
      efforts related to this area,
      important questions and challenges
      may remain.
      This study therefore seeks to
      investigate the key problem associated
      with <strong>${name}</strong>.
    </p>

  </section>


  <!-- =====================================================
       4. OBJECTIVES
  ====================================================== -->

  <section class="section">

    <h3>4. Objectives of the Study</h3>

    <p>
      <strong>General Objective</strong>
    </p>

    <p>
      To examine and analyze the major
      issues associated with
      <strong>${name}</strong>.
    </p>

    <p>
      <strong>Specific Objectives</strong>
    </p>

    <ol>

      <li>
        To examine the current situation
        relating to the research topic.
      </li>

      <li>
        To identify the major factors
        associated with the topic.
      </li>

      <li>
        To assess the effects and implications
        of the identified factors.
      </li>

      <li>
        To propose practical recommendations
        based on the findings.
      </li>

    </ol>

  </section>


  <!-- =====================================================
       5. RESEARCH QUESTIONS
  ====================================================== -->

  <section class="section">

    <h3>5. Research Questions</h3>

    <ol>

      <li>
        What is the current situation
        relating to ${name}?
      </li>

      <li>
        What factors influence the issue
        under investigation?
      </li>

      <li>
        What are the effects or implications
        associated with the issue?
      </li>

      <li>
        What measures can address the
        identified challenges?
      </li>

    </ol>

  </section>


  <!-- =====================================================
       6. SIGNIFICANCE
  ====================================================== -->

  <section class="section">

    <h3>6. Significance of the Study</h3>

    <p>
      The study may provide useful information
      to students, researchers, institutions,
      practitioners and other relevant
      stakeholders interested in
      <strong>${name}</strong>.
    </p>

    <p>
      The findings may also provide a basis
      for further research and informed
      decision-making within the relevant
      field.
    </p>

  </section>


  <!-- =====================================================
       7. SCOPE
  ====================================================== -->

  <section class="section">

    <h3>7. Scope of the Study</h3>

    <p>
      The study focuses specifically on
      <strong>${name}</strong>.
      The scope may cover the relevant
      population, geographical area,
      variables and period selected by
      the researcher.
    </p>

  </section>


  <!-- =====================================================
       8. TOPIC OVERVIEW
  ====================================================== -->

  <section class="section">

    <h3>8. Topic Overview</h3>

    <p>
      ${synopsis}
    </p>

  </section>


  <!-- =====================================================
       9. PROPOSED METHODOLOGY
  ====================================================== -->

  <section class="section">

    <h3>9. Proposed Research Methodology</h3>

    <p>
      The researcher may use an appropriate
      research design based on the nature
      of the study.
    </p>

    <ul>

      <li>Research design</li>

      <li>Target population</li>

      <li>Sample size and sampling procedure</li>

      <li>Data collection methods</li>

      <li>Data analysis procedures</li>

      <li>Ethical considerations</li>

    </ul>

  </section>


  <!-- =====================================================
       10. EXPECTED OUTCOMES
  ====================================================== -->

  <section class="section">

    <h3>10. Expected Outcomes</h3>

    <p>
      The study is expected to generate
      findings that improve understanding
      of <strong>${name}</strong> and provide
      practical recommendations relevant
      to the selected research context.
    </p>

      <!-- =====================================================
         ACTIONS
    ====================================================== -->

    <div class="actions">

      <button
        type="button"
        class="btn back"

        Close Preview

        href="${buyLink}"

      </a>

  <!-- END ONE PREVIEW CARD -->


</main>


<footer>

  All rights reserved.

</footer>


</body>

</html>

  `);

  previewWindow.document.close();
}

/* =========================================================
   RENDER RESEARCH TOPICS
========================================================= */

function render(){

  const topics =
    data[level.value]?.[programme.value] || [];


  if(!topics.length){

    results.innerHTML =
      '<div class="empty">No research topics available.</div>';

    return;

  }


  results.innerHTML = "";


  /* =======================================================
     PROGRAMME GROUP
  ======================================================== */

  const group =
    document.createElement("div");

  group.className =
    "programme open";


  /* =======================================================
     PROGRAMME TITLE
  ======================================================== */

  const title =
    document.createElement("div");

  title.className =
    "programme-title";

  title.innerHTML = `

    <span>
      ${programme.value}
      —
      ${level.options[level.selectedIndex].text}
    </span>

    <span class="sign">−</span>

  `;


  title.onclick = () => {

    group.classList.toggle("open");

    title.querySelector(".sign").textContent =
      group.classList.contains("open")
        ? "−"
        : "+";

  };


  /* =======================================================
     TOPIC LIST
  ======================================================== */

  const list =
    document.createElement("div");

  list.className =
    "topic-list";


  /* =======================================================
     CREATE EACH TOPIC
  ======================================================== */

  topics.forEach((item, i) => {

    const topic =
      document.createElement("article");

    topic.className =
      "topic";


    /* =====================================================
       TOPIC DATA
    ====================================================== */

    const name =
      typeof item === "string"
        ? item
        : item.title;


    const cover =
      typeof item === "string"
        ? IMG
        : item.cover;


    const synopsis =
      typeof item === "string"

        ? `This research topic examines <strong>${name.toLowerCase()}</strong>. The study can investigate the background of the problem, key variables, relevant stakeholders, existing evidence, methodological approaches, findings and practical recommendations.`

        : item.synopsis;


    const buyLink =
      typeof item === "string"

        ? `buy.html?topic=${encodeURIComponent(name)}`

        : item.link;


    /* =====================================================
       TOPIC CARD
    ====================================================== */

    topic.innerHTML = `

      <a
        class="topic-link"
        href="#"
        aria-expanded="false">

        ${name}

      </a>


      <div class="topic-details">


        <img
          class="cover"
          src="${cover}"
          alt="Research cover for ${name}"
          loading="lazy"
          onerror="this.style.visibility='hidden';"
        >


        <div class="synopsis">


          <h3>
            ${name}
          </h3>


          <p>
            ${synopsis}
          </p>


          <p>

            <strong>
              Academic level:
            </strong>

            ${level.options[level.selectedIndex].text}

            <br>

            <strong>
              Programme:
            </strong>

            ${programme.value}

          </p>


          <div class="actions">


            <button
              type="button"
              class="btn view">

              View

            </button>


            <a
              class="btn buy"
              href="${buyLink}">

              Buy now

            </a>


          </div>


        </div>

      </div>

    `;


    /* =====================================================
       TOPIC EXPAND / COLLAPSE
    ====================================================== */

    const topicLink =
      topic.querySelector(".topic-link");


    topicLink.addEventListener("click", e => {

      e.preventDefault();

      topic.classList.toggle("expanded");

      topicLink.setAttribute(
        "aria-expanded",
        topic.classList.contains("expanded")
      );

    });


    /* =====================================================
       VIEW BUTTON
    ====================================================== */

    const viewButton =
      topic.querySelector(".view");


    viewButton.addEventListener("click", () => {

      openResearchPreview(

        name,

        item,

        level.options[level.selectedIndex].text,

        programme.value

      );

    });


    /* =====================================================
       ADD TOPIC TO LIST
    ====================================================== */

    list.appendChild(topic);

  });


  /* =======================================================
     ADD GROUP TO RESULTS
  ======================================================== */

  group.append(
    title,
    list
  );


  results.appendChild(group);

}
</script >
<footer>Karieson Creative Hub All Rights Reserved</footer>
