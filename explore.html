}

.header-brand{

}

.header-logo{
  display:block;

}

.header-content{
  text-align:center;
  padding-top:35px;
}

h1{
  margin:0 0 10px;

}

header p{
  margin:0 auto;
  max-width:780px;
  color:var(--muted);
  line-height:1.75;
}
  

  main{
    width:min(1180px,88vw);
    margin:34px auto 70px;
  }

  .filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    margin-bottom:34px;
  }

  label{
    display:block;
    margin-bottom:9px;
    color:var(--black);
    font-weight:800;
  }

  select{
    width:100%;
    min-height:52px;
    padding:13px 16px;
    border:1px solid #bdbdbd;
    border-radius:0;
    outline:none;
    background:var(--white);
    color:var(--black);
    font:inherit;
    cursor:pointer;
    transition:border-color .2s ease,box-shadow .2s ease;
  }

  select:focus{
    border-color:var(--corporate-red);
    box-shadow:0 0 0 2px rgba(193,18,31,.12);
  }

  select:disabled{
    background:#f7f7f7;
    color:#777;
    cursor:not-allowed;
  }

  select:invalid{color:#666}

  #results{
    border-top:1px solid var(--border);
  }

  .programme{
    border-bottom:1px solid var(--border);
  }

  .programme-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    width:100%;
    padding:22px 4px;
    color:var(--black);
    cursor:pointer;
    font-size:20px;
    font-weight:800;
    line-height:1.4;
  }

  .programme-title:hover{
    color:var(--corporate-red);
  }
.sign{
  flex:0 0 auto;
  width:28px;
  color:var(--corporate-red);
  font-size:30px;
  font-weight:400;
  line-height:1;
  text-align:center;
}
  

  .topic-list{
    display:none;
    padding:0 4px 25px;
  }

  .programme.open .topic-list{display:block}

  .topic{
    padding:17px 0;
    border-top:1px solid #eeeeee;
  }

  .topic-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    width:100%;
    color:var(--black);
    text-decoration:none;
    font-size:17px;
    font-weight:800;
    line-height:1.5;
    cursor:pointer;
    transition:color .2s ease;
  }

  .topic-link:hover{
    color:var(--corporate-red);
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:3px;
  }
.topic-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
}

.topic-link:after{
  content:"+";
  margin-left:auto;
  color:var(--corporate-red);
  font-size:30px;
  font-weight:400;
  line-height:1;
}

.topic.expanded .topic-link:after{
  content:"−";
}

  .topic-details{
    display:none;
    margin-top:20px;
  }

  .topic.expanded .topic-details{
    display:grid;
    grid-template-columns:minmax(220px,320px) 1fr;
    gap:28px;
    align-items:start;
  }

  .cover{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  border:1px solid #d5d5d5;
  background:#f5f5f5;
}
.synopsis{
  color:#444;
  font-size:1rem;
  line-height:1.8;
  text-align:left;
}

.synopsis h3{
  margin:0 0 11px;
  color:var(--black);
  font-size:1.5rem;
  font-weight:800;
  line-height:1.3;
  text-align:left;
}

.synopsis p{
  margin:0 0 14px;
}

.synopsis strong{
  color:var(--black);
}


.actions{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

.btn{
  display:inline-block;
  padding:11px 20px;
  border-radius:0;
  text-decoration:none;
  font-size:15px;
  font-weight:800;
  line-height:1.3;
  border:1px solid var(--corporate-red);
  transition:background .2s ease,color .2s ease,border-color .2s ease;
}

  .view{
    color:var(--corporate-red);

  .view:hover{
    color:var(--white);
    background:var(--corporate-red);
  }

  .buy{
    color:var(--white);
    background:var(--corporate-red);
  }

  .buy:hover{
    color:var(--white);
    background:var(--black);
    border-color:var(--black);
  }

  .empty{
    padding:48px 4px;
    color:#666;
    text-align:center;
  }

    margin-top:70px;

    background:var(--black-2222);
    color:var(--white);
    text-align:center;
    font-size:14px;

/* =========================================================
   RENDER RESEARCH TOPICS
========================================================= */

function render(){

  const topics =
    data[level.value]?.[programme.value] || [];


  if(!topics.length){

    results.innerHTML =
      '<div class="empty">No research topics available.</div>';

    return;

  }


  results.innerHTML = "";


  /* =======================================================
     PROGRAMME GROUP
  ======================================================== */

  const group =
    document.createElement("div");

  group.className =
    "programme open";


  /* =======================================================
     PROGRAMME TITLE
  ======================================================== */

  const title =
    document.createElement("div");

  title.className =
    "programme-title";

  title.innerHTML = `

    <span>
      ${programme.value}
      —
      ${level.options[level.selectedIndex].text}
    </span>

    <span class="sign">−</span>

  `;


  title.onclick = () => {

    group.classList.toggle("open");

    title.querySelector(".sign").textContent =
      group.classList.contains("open")
        ? "−"
        : "+";

  };


  /* =======================================================
     TOPIC LIST
  ======================================================== */

  const list =
    document.createElement("div");

  list.className =
    "topic-list";


  /* =======================================================
     CREATE EACH TOPIC
  ======================================================== */

  topics.forEach((item, i) => {

    const topic =
      document.createElement("article");

    topic.className =
      "topic";


    /* =====================================================
       TOPIC DATA
    ====================================================== */

    const name =
      typeof item === "string"
        ? item
        : item.title;


    const cover =
      typeof item === "string"
        ? IMG
        : item.cover;


    const synopsis =
      typeof item === "string"

        ? `This research topic examines <strong>${name.toLowerCase()}</strong>. The study can investigate the background of the problem, key variables, relevant stakeholders, existing evidence, methodological approaches, findings and practical recommendations.`

        : item.synopsis;


    const buyLink =
      typeof item === "string"

        ? `buy.html?topic=${encodeURIComponent(name)}`

        : item.link;


    /* =====================================================
       TOPIC CARD
    ====================================================== */

    topic.innerHTML = `

      <a
        class="topic-link"
        href="#"
        aria-expanded="false">

        ${name}

      </a>


      <div class="topic-details">


        <img
          class="cover"
          src="${cover}"
          alt="Research cover for ${name}"
          loading="lazy"
          onerror="this.style.visibility='hidden';"
        >


        <div class="synopsis">


          <h3>
            ${name}
          </h3>


          <p>
            ${synopsis}
          </p>


          <p>

            <strong>
              Academic level:
            </strong>

            ${level.options[level.selectedIndex].text}

            <br>

            <strong>
              Programme:
            </strong>

            ${programme.value}

          </p>


          <div class="actions">


            <button
              type="button"
              class="btn view">

              View

            </button>


            <a
              class="btn buy"
              href="${buyLink}">

              Buy now

            </a>


          </div>


        </div>

      </div>

    `;


    /* =====================================================
       TOPIC EXPAND / COLLAPSE
    ====================================================== */

    const topicLink =
      topic.querySelector(".topic-link");


    topicLink.addEventListener("click", e => {

      e.preventDefault();

      topic.classList.toggle("expanded");

      topicLink.setAttribute(
        "aria-expanded",
        topic.classList.contains("expanded")
      );

    });


    /* =====================================================
       VIEW BUTTON
    ====================================================== */

    const viewButton =
      topic.querySelector(".view");


    viewButton.addEventListener("click", () => {

      openResearchPreview(

        name,

        item,

        level.options[level.selectedIndex].text,

        programme.value

      );

    });


    /* =====================================================
       ADD TOPIC TO LIST
    ====================================================== */

    list.appendChild(topic);

  });


  /* =======================================================
     ADD GROUP TO RESULTS
  ======================================================== */

  group.append(
    title,
    list
  );


  results.appendChild(group);

}
