<style>

:root {
    --red: #c00000;
    --dark-red: #8f0000;
    --black: #080808;
    --white: #ffffff;
    --gray: #666666;
    --border: #dddddd;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--white);
    color: var(--black);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    line-height: 1.6;
}


/* ==================================================
   HEADER
================================================== */

.site-header {
    background: var(--black);
    color: var(--white);

    padding: 1.5rem 7%;
}

.header-inner {
    max-width: 1100px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 1rem;
}

.header-logo {
    display: block;
    width: 180px;
    height: auto;
    object-fit: contain;
}
@media (max-width: 600px) {

    .header-logo {
        width: 150px;
    }

}

/* ==================================================
   HERO
================================================== */

.hero {
    background: var(--black);
    color: var(--white);

    padding: 4rem 7% 5rem;

    text-align: center;
}

.hero-inner {
    max-width: 850px;
    margin: auto;
}

.hero h1 {
    margin: 0 0 0.8rem;

    font-size: clamp(2.2rem, 6vw, 4rem);

    line-height: 1.1;
}

.hero h1 span {
    color: var(--red);
}

.hero p {
    max-width: 650px;
    margin: auto;

    color: #dddddd;

    font-size: 1rem;
}


/* ==================================================
   NOVEL LIST
================================================== */

.novels-container {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    padding: 4rem 1.5rem 5rem;
}

.category {
    margin-bottom: 3rem;
}

.category-title {
    margin: 0 0 0.8rem;

    padding-bottom: 0.6rem;

    color: var(--red);

    font-size: 1.35rem;
    font-weight: 700;

    border-bottom: 2px solid var(--red);
}


/* ==================================================
   CLICKABLE NOVEL
================================================== */

.novel-link {
    display: block;

    width: 100%;

    padding: 0.9rem 0.5rem;

    color: var(--black);

    font-size: 1rem;
    font-weight: 600;

    text-decoration: none;

    border-bottom: 1px solid var(--border);

    transition:
        color 0.2s ease,
        padding-left 0.2s ease,
        background 0.2s ease;
}

.novel-link:hover {
    color: var(--red);

    padding-left: 1rem;

    background: #fafafa;
}
/* ==================================================
   ALL NOVELS
================================================== */

.all-novels {
    min-height: 100vh;
    padding: 70px 7%;
    background: #ffffff;
}

.all-novels h1 {
    margin: 0 0 35px;
    color: #c00000;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2.3rem;
    text-align: center;
}


/* ==================================================
   NOVEL LIST
================================================== */

.novel-list {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
}


/* Each numbered novel row */

.novel {
    width: 100%;
    margin: 0;
    padding: 0;
}


/* Novel title */

.novel-title {
    display: block;
    width: 100%;

    padding: 13px 8px;

    border: none;
    border-bottom: 1px solid #dddddd;

    background: transparent;

    color: #222222;

    font-family: "Roboto", Arial, sans-serif;
    font-size: 1rem;
    font-weight: 500;

    text-align: left;

    cursor: pointer;

    transition:
        color 0.2s ease,
        padding-left 0.2s ease,
        background 0.2s ease;
}

.novel-title:hover {
    color: #c00000;
    background: #fafafa;
    padding-left: 14px;
}


/* ==================================================
   NOVEL DETAILS
================================================== */

.detail {
    display: none;

    width: 100%;

    padding: 30px 15px;

    border-bottom: 1px solid #dddddd;

    background: #ffffff;

    text-align: center;
}

.detail.show {
    display: block;
}

.detail-content {
    width: 100%;
    max-width: 650px;

    margin: 0 auto;

    text-align: center;
}


/* ==================================================
   NOVEL TITLE
================================================== */

.detail h2 {
    margin: 0 0 25px;

    color: #c00000;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    line-height: 1.3;

    text-align: center;
}


/* ==================================================
   COVER
================================================== */

.cover {
    width: 100%;

    margin: 0 auto 25px;

    text-align: center;
}

.cover img {
    display: block;

    width: auto;
    max-width: 250px;
    max-height: 370px;

    margin: 0 auto;

    object-fit: contain;
}


/* ==================================================
   SYNOPSIS
================================================== */

.synopsis {
    width: 100%;
    max-width: 620px;

    margin: 0 auto 20px;

    color: #333333;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem;
    line-height: 1.8;

    text-align: center;
}

.synopsis strong {
    color: #c00000;
}


/* ==================================================
   PRICE
================================================== */

.price {
    margin: 15px 0;

    color: #000000;

    font-family: "Roboto", Arial, sans-serif;
    font-size: 0.95rem;
    font-weight: 600;

    text-align: center;
}


/* ==================================================
   CENTERED BUTTONS
================================================== */

.buttons {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    width: 100%;

    margin: 20px auto 0;

    text-align: center;
}

.btn {
    display: inline-block;

    padding: 8px 16px;

    border: 1px solid #000000;

    font-family: "Roboto", Arial, sans-serif;
    font-size: 0.85rem;
    font-weight: 500;

    text-decoration: none;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
}


/* ==================================================
   VIEW — BLACK
================================================== */

.btn.view {
    background: #000000;
    color: #ffffff;

    border-color: #000000;
}

.btn.view:hover {
    background: #c00000;
    color: #ffffff;

    border-color: #c00000;
}


/* ==================================================
   BUY NOW — RED
================================================== */

.btn.buy {
    background: #c00000;
    color: #ffffff;

    border-color: #c00000;
}

.btn.buy:hover {
    background: #000000;
    color: #ffffff;

    border-color: #000000;
}


/* ==================================================
   BACK LINK
================================================== */

.back-link {
    display: block;

    width: fit-content;

    margin: 0 auto 50px;

    color: #c00000;

    font-family: "Roboto", Arial, sans-serif;
    font-size: 0.9rem;
    font-weight: 500;

    text-decoration: none;
}

.back-link:hover {
    color: #000000;

/* ==================================================

}

</style>

/* ==================================================
   ALL NOVELS LANDING PAGE
================================================== */

function showAllNovels() {

    const list = document.getElementById("allNovelsList");

    if (!list) return;

    list.innerHTML = "";

    let novelNumber = 1;

    Object.keys(novels).forEach(function(type) {

        novels[type].books.forEach(function(book, index) {

            /* Novel title */

            const novelRow = document.createElement("div");

            novelRow.className = "novel";

            novelRow.innerHTML = `
                <button
                    class="novel-title"
                    onclick="openAllNovel('${type}', ${index})"
                >
                    ${novelNumber}. ${book.name}
                </button>
            `;

            list.appendChild(novelRow);


            /* Novel details */

            const detail = document.createElement("div");

            detail.className = "detail";

            detail.id = "all-detail-" + type + "-" + index;

            detail.innerHTML = `
                <div class="detail-content">

                    <h2>${book.name}</h2>

                    <div class="cover">
                        <img
                            src="${book.image}"
                            alt="${book.name}"
                        >
                    </div>

                    <div class="synopsis">

                        <strong>Synopsis</strong>

                        <br><br>

                        ${book.synopsis}

                    </div>

                    ${
                        book.price
                        ? `<div class="price">${book.price}</div>`
                        : ""
                    }

                    <div class="buttons">

                        <a
                            href="${book.preview}"
                            class="btn view"
                        >
                            View
                        </a>

                        ${
                            book.buyLink
                            ? `
                            <a
                                href="${book.buyLink}"
                                class="btn buy"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Buy Now
                            </a>
                            `
                            : ""
                        }

                    </div>

                </div>
            `;

            list.appendChild(detail);

            novelNumber++;

        });

    });

}

/* ==================================================
   OPEN NOVEL
================================================== */

function openAllNovel(type, index) {

    const selected =
        document.getElementById(
            "all-detail-" + type + "-" + index
        );


    document.querySelectorAll(
        "#allNovelsList .detail"
    ).forEach(function(detail) {

        if (detail !== selected) {

            detail.classList.remove("show");

        }

    });


    selected.classList.toggle("show");


    if (selected.classList.contains("show")) {

        setTimeout(function() {

            selected.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

        }, 100);

    }

}


/* ==================================================
   LOAD ALL NOVELS
================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        showAllNovels();

    }
);
